<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>45-Minute Training Timer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f1f5f6;--panel:#ffffff;--text:#10222b;--muted:#566f79;--line:#d5e0e3;
  --warm:#3f9a30;--hard:#d92b4d;--easy:#0f9d96;--lift:#7a58e0;--rest:#b27a00;--cool:#2f62d1;--done:#10222b;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1a21;--panel:#15252e;--text:#eaf2f4;--muted:#8ea5ae;--line:#25404c;
    --warm:#8bd17c;--hard:#ff4d6d;--easy:#3fd0c9;--lift:#b69cff;--rest:#f2c14e;--cool:#7aa7ff;--done:#eaf2f4;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1a21;--panel:#15252e;--text:#eaf2f4;--muted:#8ea5ae;--line:#25404c;
  --warm:#8bd17c;--hard:#ff4d6d;--easy:#3fd0c9;--lift:#b69cff;--rest:#f2c14e;--cool:#7aa7ff;--done:#eaf2f4;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;font-family:'Figtree',system-ui,sans-serif;color:var(--text);
  --ph:var(--done);background:color-mix(in srgb,var(--ph) 13%,var(--bg));transition:background .4s}
body[data-t=warm]{--ph:var(--warm)}body[data-t=hard]{--ph:var(--hard)}body[data-t=easy]{--ph:var(--easy)}
body[data-t=lift]{--ph:var(--lift)}body[data-t=rest]{--ph:var(--rest)}body[data-t=cool]{--ph:var(--cool)}body[data-t=steady]{--ph:var(--steady)}
main{max-width:560px;margin:0 auto;padding:16px 16px 40px}
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.days button{padding:10px 0;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;
  font:600 15px 'Figtree',sans-serif;cursor:pointer}
.days button[aria-pressed=true]{background:var(--text);color:var(--bg);border-color:var(--text)}
h1{font:800 22px/1.1 'Big Shoulders Display','Arial Narrow',Impact,sans-serif;letter-spacing:.02em;margin:18px 0 2px}
.gear{color:var(--muted);font-size:14px;margin:0}
.stage{position:relative;width:min(80vw,340px);aspect-ratio:1;margin:18px auto 6px}
.stage svg{width:100%;height:100%;transform:rotate(-90deg)}
.trk{fill:none;stroke:var(--line);stroke-width:14}
.arc{fill:none;stroke:var(--ph);stroke-width:14;stroke-linecap:round}
.mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 40px}
.phase{font:700 26px/1 'Big Shoulders Display','Arial Narrow',Impact,sans-serif;color:var(--ph);letter-spacing:.03em}
.time{font:800 clamp(68px,22vw,104px)/1 'Big Shoulders Display','Arial Narrow',Impact,sans-serif;font-variant-numeric:tabular-nums;margin:2px 0}
.round{font-size:14px;color:var(--muted);min-height:18px}
.cue{text-align:center;font-size:17px;margin:10px auto 0;max-width:420px;min-height:46px}
.next{text-align:center;color:var(--muted);font-size:14px;margin:4px 0 14px}
.next b{color:var(--text)}
.ctl{display:flex;justify-content:center;align-items:center;gap:14px}
.ctl button{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:50%;width:56px;height:56px;cursor:pointer;
  display:grid;place-items:center}
.ctl button svg{width:24px;height:24px;fill:currentColor}
.ctl .go{width:84px;height:84px;background:var(--ph);border-color:var(--ph);color:#fff}
.ctl .go svg{width:36px;height:36px}
button:focus-visible{outline:3px solid var(--text);outline-offset:2px}
.tl{display:flex;gap:2px;height:30px;margin:26px 0 8px;align-items:stretch}
.tl i{display:block;min-width:2px;border-radius:3px;background:var(--c);opacity:.28;cursor:pointer}
.tl i.past{opacity:.75}.tl i.now{opacity:1;outline:2px solid var(--text);outline-offset:1px}
.tot{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.tot div{height:100%;width:0;background:var(--ph)}
.stat{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;margin-top:8px;font-variant-numeric:tabular-nums}
.opts{display:flex;gap:10px;justify-content:center;margin-top:22px}
.opts button{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:999px;padding:8px 14px;font:600 14px 'Figtree',sans-serif;cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;margin-top:20px;font-size:13px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);margin-right:6px}
@media (prefers-reduced-motion:reduce){body{transition:none}}
.coach{margin:16px 0 0;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.coach svg{width:100%;height:170px;display:block;color:var(--ph)}
#fb,#fg,#fl{fill:none;stroke:currentColor;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
#fg{opacity:.4}#fl{stroke-width:2;opacity:.6}#fcap{fill:var(--muted);font:600 11px 'Figtree',sans-serif}#prop{fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round}
#fh{fill:var(--panel);stroke:currentColor;stroke-width:4}#fw{fill:var(--text)}
.tgt{font:700 20px/1.15 'Big Shoulders Display','Arial Narrow',Impact,sans-serif;letter-spacing:.02em;margin:6px 0 4px}
.coach p{margin:4px 0;font-size:14px;color:var(--muted)}.coach p.say{color:var(--text);font-size:16px;font-weight:600}
.hud{display:flex;gap:10px;justify-content:center;margin-top:18px;font:700 20px 'Big Shoulders Display','Arial Narrow',Impact,sans-serif}
.hud span{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 14px}
a.lnk{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:999px;padding:8px 14px;font:600 14px 'Figtree',sans-serif;text-decoration:none}
.tk{margin-top:28px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.tk h2{margin:0 0 8px;font:800 22px 'Big Shoulders Display','Arial Narrow',Impact,sans-serif}
.tk p{margin:6px 0;font-size:14px}.tk .fine{color:var(--muted);font-size:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0;align-items:end}
.row label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:2px;flex:1 1 70px}
.tk input,.tk select{font:inherit;padding:7px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);width:100%}
.tk .row button,.ch button{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:8px;padding:8px 14px;font:600 14px 'Figtree',sans-serif;cursor:pointer}
.ch{display:flex;justify-content:space-between;align-items:center;margin:14px 0 6px}
.cw,.cgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cw span{text-align:center;font-size:12px;color:var(--muted)}
.cd{aspect-ratio:1;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:8px;font:600 13px 'Figtree',sans-serif;position:relative;cursor:pointer;padding:0}
.cd.we{opacity:.5}.cd.on{background:var(--easy);color:#fff;border-color:var(--easy);opacity:1}.cd.on::after{content:"✓";position:absolute;top:1px;right:4px;font-size:11px}
.cd small{display:block;font-size:10px;font-weight:400}.cd.td{outline:2px solid var(--text)}
.views{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}
.views button{padding:12px 0;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;font:600 15px 'Figtree',sans-serif;cursor:pointer}
.views button[aria-pressed=true]{background:var(--text);color:var(--bg);border-color:var(--text)}
[hidden]{display:none!important}
.days button{padding:12px 0}
.colA,.colB{display:contents}
.stage{width:min(66vw,38vh,300px)}
.ctl{position:sticky;bottom:0;z-index:5;padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--ph) 13%,var(--bg))}
#vp .tk{margin-top:0}
@media (min-width:720px){
  main{max-width:1040px}
  .train{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}
  .colA,.colB{display:block;min-width:0}
  .stage{width:min(36vw,54vh,360px)}
  .ctl{position:static;padding:10px 0;background:none}
  #vp .tk{max-width:680px;margin:0 auto}
}
.hint{text-align:center;color:var(--muted);font-size:13px;margin:8px 0 0}
.dn .dr{display:grid;grid-template-columns:48px 1fr 48px;gap:6px;align-items:center}
.dn .dr button{padding:10px 0;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;font:600 18px 'Figtree',sans-serif;cursor:pointer}
#dl{text-align:center;font-weight:600}
.mr{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.mr button{flex:1 1 auto;padding:10px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;font:600 13px 'Figtree',sans-serif;cursor:pointer}
.mr button[aria-pressed=true]{background:var(--text);color:var(--bg);border-color:var(--text)}
.cd.sel{box-shadow:0 0 0 3px var(--lift)}
.logr{display:flex;gap:8px;justify-content:center;margin-top:12px}
.logr input{flex:1;min-width:0;max-width:240px;padding:10px 12px;border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--text);font:inherit;font-size:14px}
.logr button{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:999px;padding:10px 16px;font:600 14px 'Figtree',sans-serif;cursor:pointer}
@media (max-height:560px) and (min-width:560px){
  main{max-width:none;padding:6px 12px 6px}
  .views{display:flex;gap:6px;margin-bottom:6px}.views button{flex:0 0 auto;padding:6px 16px}
  .train{display:grid;grid-template-columns:minmax(240px,.85fr) minmax(0,1.15fr);gap:14px;align-items:start}
  .colA,.colB{display:block;min-width:0}
  .colB{max-height:calc(100dvh - 52px);overflow-y:auto;padding-bottom:8px}
  h1{display:none}.legend{margin-top:6px;font-size:12px}.gear{font-size:12px;margin:2px 0}
  .days button{padding:7px 0}
  .stage{width:min(40dvh,230px);margin:4px auto 2px}
  .phase{font-size:20px}.time{font-size:clamp(44px,13vh,76px)}
  .cue{margin:4px auto;min-height:0;font-size:15px}.next{margin:0 0 6px}
  .ctl{position:static;padding:4px 0;gap:12px;background:none}
  .ctl button{width:46px;height:46px}.ctl .go{width:64px;height:64px}
  .coach{margin-top:0}.coach svg{height:104px}
  .tl{margin:10px 0 6px}
  #vp .tk{max-width:none}
}
.views{display:flex;justify-content:flex-end;margin-bottom:6px}
.views button{padding:8px 14px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:999px;font:600 13px 'Figtree',sans-serif;cursor:pointer}
@media (max-height:420px) and (min-width:520px){
  main{padding:4px 10px;position:relative}
  .views{position:absolute;top:4px;right:10px;margin:0;z-index:6}.views button{padding:5px 12px;font-size:12px}
  .train{display:grid;grid-template-columns:auto minmax(150px,.8fr) minmax(0,1.2fr);gap:4px 14px;align-items:start}
  .colA,.colB{display:contents}
  .days{grid-column:1/4;grid-row:1;display:flex!important;gap:8px;align-items:center;padding-right:120px}
  .dn .dr{flex:0 0 auto;grid-template-columns:34px auto 34px}.dn .dr button{padding:3px 0}
  .mr{margin:0;flex-wrap:nowrap}.mr button{padding:5px 8px}
  h1,.gear,.opts,.stat,.tot{display:none}
  .legend{grid-column:1/4;grid-row:6;display:flex;flex-wrap:nowrap;justify-content:center;gap:2px 10px;margin:2px 0 0;font-size:11px;white-space:nowrap}
  .stage{grid-column:1;grid-row:2/5;--w:clamp(110px,calc(100vh - 104px),200px);--w:clamp(110px,calc(100dvh - 104px),200px);width:var(--w);margin:0}
  .time{font-size:calc(var(--w)*.3)}.phase{font-size:calc(var(--w)*.1)}.round{display:none}
  .cue{grid-column:2;grid-row:2;margin:0;min-height:0;font-size:14px;text-align:left}
  .next{grid-column:2;grid-row:3;margin:0;text-align:left}
  .ctl{grid-column:2;grid-row:4;position:static;padding:0;background:none;gap:10px;justify-content:flex-start;align-self:start}
  .ctl button{width:44px;height:44px}.ctl .go{width:60px;height:60px}
  .coach{grid-column:3;grid-row:2/5;margin:0;padding:6px 10px;overflow:auto;max-height:calc(100dvh - 104px)}
  .coach svg{height:74px}.tgt{font-size:15px;margin:2px 0}.coach p{font-size:12px;margin:2px 0}
  .tl{grid-column:1/4;grid-row:5;margin:4px 0 0;height:16px}
}
.views{display:flex;flex-wrap:wrap;gap:6px}.views button{flex:1 1 auto;padding:10px 12px;font-size:13px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;font-family:'Figtree',sans-serif;font-weight:600;cursor:pointer}
.views button[aria-pressed=false]{opacity:.65}
@media (max-height:560px) and (min-width:560px){.views button{flex:0 0 auto;padding:6px 12px}}
@media (max-height:420px) and (min-width:520px){.views{gap:4px;flex-wrap:nowrap}.views button{padding:5px 9px;font-size:12px}.days{padding-right:230px;flex-wrap:wrap}#dl{font-size:12px}}
:root{--steady:#0f8fbf}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--steady:#5ec8f2}}
:root[data-theme="dark"]{--steady:#5ec8f2}
</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0e1a21">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
</head>
<body data-t="done">
<main>
  <div class="views"><button id="snd" aria-pressed="true">Sound on</button><button id="vc" aria-pressed="true">Voice on</button><button id="rst">Restart</button></div>
  <div class="train" id="vt"><div class="colA"><div class="days" id="days" role="group" aria-label="Choose day"></div>
  <h1 id="title"></h1>
  <p class="gear" id="gear"></p>
  <div class="stage">
    <svg viewBox="0 0 200 200" aria-hidden="true"><circle class="trk" cx="100" cy="100" r="90"/><circle class="arc" id="arc" cx="100" cy="100" r="90"/></svg>
    <div class="mid"><div class="phase" id="phase"></div><div class="time" id="time" role="timer" aria-live="off"></div><div class="round" id="round"></div></div>
  </div>
  <p class="cue" id="cue"></p>
  <p class="next" id="next"></p>
  <div class="ctl">
    <button id="prev" aria-label="Previous interval"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
    <button class="go" id="go" aria-label="Start"></button>
    <button id="skip" aria-label="Next interval"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
  </div>
  </div><div class="colB"><section class="coach" aria-label="Coach">
    <svg id="fig" viewBox="0 0 200 125" aria-hidden="true"><path id="prop"/><path id="fg"/><path id="fb"/><path id="fl"/><text id="fcap" x="6" y="14"></text><circle id="fh" r="7"/><circle id="fw" r="4.5"/></svg>
    <div class="tgt" id="tgt"></div><p id="pos"></p><p id="var"></p><p class="say" id="coach"></p>
  </section>
  <div class="tl" id="tl" aria-label="Workout timeline"></div>
  <div class="tot"><div id="bar"></div></div>
  <div class="stat"><span id="el">0:00 done</span><span id="left">45:00 left</span></div>
  <div class="legend">
    <span style="--c:var(--warm)">Warm-up</span><span style="--c:var(--hard)">Hard</span><span style="--c:var(--easy)">Easy</span><span style="--c:var(--steady)">Steady</span>
    <span style="--c:var(--lift)">Lift</span><span style="--c:var(--rest)">Rest</span><span style="--c:var(--cool)">Cool-down</span>
  </div>
  </div></div>
  </main>
<script>
const S=(n,s,t,c,r)=>({n,s,t,c,r:r||''});
const rep=(k,f)=>Array.from({length:k},(_,i)=>f(i+1)).flat();
const NAMES={warm:'Warm up',hard:'Go hard',easy:'Recover',lift:'Lift',steady:'Steady',rest:'Rest',cool:'Cool down'};
function circuit(rounds,ex,work,rest,between,label){
  return rep(rounds,r=>{
    const out=[];
    ex.forEach(([n,c],i)=>{
      out.push(S(n,work,'lift',c,label+' '+r+' of '+rounds));
      const last=i===ex.length-1;
      if(!last)out.push(S('Rest',rest,'rest','Shake it out, set up the next move',label+' '+r+' of '+rounds));
      else if(r<rounds)out.push(S('Round rest',between,'rest','Water, breathe, reset',label+' '+r+' of '+rounds));
    });
    return out;
  });
}
const DAYS=[
{id:'Mon',title:'Rowing HIIT + strength',gear:'Rower and dumbbells',segs:[
  S('Warm-up row',300,'warm','Easy pace, build to a steady stroke'),
  ...rep(12,r=>[S('Hard row',40,'hard','Drive with the legs, then lean, then pull the arms','Interval '+r+' of 12'),S('Easy row',80,'easy','Slow strokes, breathe down','Interval '+r+' of 12')]),
  ...circuit(3,[['Romanian deadlift x10','Hinge at the hips, soft knees, flat back'],['Push-ups x10','Incline push-ups are fine. Keep the core tight'],['Bent-over row x10','Pull elbows to the hips']],60,20,20,'Round'),
  S('Easy row',260,'cool','Slow and smooth, let the heart rate fall')]},
{id:'Tue',title:'Bike interval ladder',gear:'Recumbent bike',segs:[
  S('Warm-up',300,'warm','Easy spin, light resistance'),
  ...[1,2,3,4,3,2,1].flatMap((m,i,a)=>{const o=[S(m+' min hard',m*60,'hard','High resistance, strong steady push','Step '+(i+1)+' of 7')];if(i<a.length-1)o.push(S('Easy spin',90,'easy','Light resistance, breathe','Step '+(i+1)+' of 7'));return o;}),
  S('Steady ride',720,'lift','Moderate pace, you can still talk'),
  S('Cool-down',180,'cool','Slow the legs down')]},
{id:'Wed',title:'Full-body strength circuit',gear:'Dumbbells, bench or chair, light bike or rower',segs:[
  S('Warm-up row',300,'warm','Easy row, build to a steady stroke'),
  ...circuit(4,[['Goblet box squat','Sit back to a chair, partial depth, knees tracking over toes'],['Shoulder press','Brace your core, press straight up'],['Weighted glute bridge','Squeeze at the top for a beat'],['Single-arm row','Switch arms at 20 seconds'],['Curl to press','Smooth and controlled'],['Plank','Straight line, breathe']],40,20,120,'Round'),
  S('Easy bike',300,'easy','Light spin to flush the legs'),
  S('Stretch',380,'cool','Hips, hamstrings, chest, shoulders')]},
{id:'Thu',title:'Incline walk intervals',gear:'Treadmill. Swap to bike if knees complain',segs:[
  S('Warm-up walk',300,'warm','Flat, easy pace'),
  ...rep(7,r=>[S('Steep incline',180,'hard','8 to 12% incline, brisk 3.0 to 3.8 mph. Hands off rails','Interval '+r+' of 7'),S('Easy incline',120,'easy','2 to 3% incline, relaxed pace','Interval '+r+' of 7')]),
  S('Cool-down walk',300,'cool','Flat and slow')]},
{id:'Fri',title:'Row endurance + sprints',gear:'Rower',segs:[
  S('Warm-up row',300,'warm','Easy pace'),
  S('Steady row',1200,'lift','Hard but conversational. Hold a steady split'),
  ...rep(8,r=>[S('Sprint',30,'hard','All out, legs first','Sprint '+r+' of 8'),S('Easy row',60,'easy','Recover','Sprint '+r+' of 8')]),
  S('Dead bug',60,'lift','Low back stays on the floor','Core'),S('Plank',60,'lift','Straight line, breathe','Core'),S('Russian twist',60,'lift','Hold a light dumbbell, rotate from the ribs','Core'),S('Bird dog',120,'lift','Reach long, keep hips level','Core'),
  S('Cool-down row',180,'cool','Very easy')]}
];
const $=id=>document.getElementById(id);
const C=2*Math.PI*90;$('arc').style.strokeDasharray=C;
let day=0,idx=0,rem=0,endAt=0,running=false,done=false,sound=true,ac=null,wl=null,lastSec=-1;
const segs=()=>DAYS[day].segs;
const fmt=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
const total=()=>segs().reduce((a,s)=>a+s.s,0);

function beep(f,d){if(!sound||!ac)return;try{const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.type='sine';o.connect(g);g.connect(ac.destination);
  g.gain.setValueAtTime(.0001,ac.currentTime);g.gain.exponentialRampToValueAtTime(.4,ac.currentTime+.01);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.start();o.stop(ac.currentTime+d+.02);}catch(e){}}
const vib=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
async function lock(){try{if('wakeLock'in navigator)wl=await navigator.wakeLock.request('screen')}catch(e){}}
function unlock(){try{wl&&wl.release();wl=null}catch(e){}}

function buildDays(){
  const d=$('days');d.innerHTML='';

const CUE={'Goblet box squat':'Sit back to the bench, drive up through the heels','Romanian deadlift x10':'Hinge at the hips, back flat','Weighted glute bridge':'Squeeze at the top for a beat','Shoulder press':'Brace your core, press straight up','Bent-over row x10':'Pull elbows to your hips','Push-ups x10':'Body in one line, controlled','Curl to press':'Smooth and controlled','Single-arm row':'Switch arms halfway','Plank':'Straight line, breathe','Dead bug':'Low back stays down','Russian twist':'Rotate from the ribs','Bird dog':'Reach long, hips level'};
const POOL={low:['Goblet box squat','Romanian deadlift x10','Weighted glute bridge'],up:['Shoulder press','Bent-over row x10','Push-ups x10','Curl to press','Single-arm row'],core:['Plank','Dead bug','Russian twist','Bird dog']};
const FM={row:[['40/80 intervals',[40],80],['30/60 intervals',[30],60],['60/60 power intervals',[60],60],['Pyramid 20-60 sec',[20,40,60,40,20],60]],
 bike:[['Ladder 1-2-3-2-1 min',[60,120,180,120,60],90],['30/30 sprints',[30],30],['90/90 intervals',[90],90],['4-min pushes',[240],120]],
 tread:[['3/2 incline intervals',[180],120],['Hill climb 2-min steps',[120],90],['Pyramid climb',[60,120,180,120,60],90],['4/2 steep pushes',[240],120]]};
const NM={row:['Hard row','Easy row','Warm-up row','Steady row','Cool-down row'],bike:['Hard ride','Easy spin','Warm-up spin','Steady ride','Cool-down spin'],tread:['Steep incline','Easy incline','Warm-up walk','Steady incline','Cool-down walk']};
const HC={row:'Legs, then lean, then pull. Stay at 28–30 SPM',bike:'Strong steady push, stay seated',tread:'Brisk steps, hands off the rails'};
function cardio(eq,f,lv,time){const[,wk,rs]=f,N=NM[eq],out=[],R=Math.round(rs*(lv<0?1.15:lv>0?.9:1));let used=0,j=0;
  for(;;){const w=Math.max(20,r5(wk[j%wk.length]*(lv>0?1.15:lv<0?.85:1)));if(used+w+R>time)break;out.push(S(N[0],w,'hard',HC[eq]),S(N[1],R,'easy','Recover and breathe down'));used+=w+R;j++}
  out.forEach((x,i)=>x.r='Interval '+(Math.floor(i/2)+1)+' of '+out.length/2);return out}
function lifts(names,lv,time){const w=40+5*lv,r=lv<0?25:20,bt=lv>0?75:90,n=names.length,rt=n*w+(n-1)*r,k=Math.floor((time+bt)/(rt+bt));
  return k>0?circuit(k,names.map(x=>[x,CUE[x]]),w,r,bt,'Round'):[]}
function build(d,m,salt){
  const T0=m*60,wd=d.getDay(),[lv,note]=level(d),alt=salt%2===1,wk=wd%6>0,MN={row:'Rower',bike:'Recumbent bike',tread:'Treadmill'};
  const eq=!wk?'tread':[0,'row','bike','row','bike','row'][wd],N=NM[eq],wu=m>=45?300:210,cd=m>=45?240:150,main=T0-wu-cd;
  const fin=(names,time)=>{const w=45+5*lv,r=15,bt=30,n=names.length,rt=n*w+(n-1)*r,k=Math.floor((time+bt)/(rt+bt));return k>0?circuit(k,names.map(x=>[x,CUE[x]||'Smooth and controlled']),w,r,bt,'Round'):[]};
  const ST='Hard but conversational, hold a steady split';
  let segs=[S(N[2],wu,'warm','Easy start, build to a steady pace')],title,used=0,gear=MN[eq],cool=N[4];
  if(!wk){segs.push(S(N[1],main,'easy','Relaxed walk, nose breathing'));used=main;title='Easy walk (optional rest day)'}
  else if(eq==='row'){let c,f;
    if(wd===1){f=alt?FM.row[3]:FM.row[2];c=cardio('row',f,lv,main);title=f[0]}
    else if(wd===3){
      if(alt){f=FM.row[0];c=cardio('row',f,lv,main);title=f[0]}
      else{c=[];let u=0,j=1;const st=Math.round(240*(lv<0?.85:1));
        while(u+st+60<=main){c.push(S(N[3],st,'steady',ST,'Block '+j),S(N[0],60,'hard',HC.row,'Block '+j));u+=st+60;j++}
        const r=main-u;if(r>=120)c.push(S(N[3],r,'steady',ST));title='Steady rows with 1-minute surges'}}
    else{const sec=Math.round(main*.33/60)*60;
      if(alt){f=FM.row[1];c=cardio('row',f,lv,main);title=f[0]}
      else{c=[S(N[3],sec,'steady',ST),...cardio('row',['',[30],30],lv,main-sec)];title='Steady row, then 30/30 sprints'}}
    used=sum(c);segs=segs.concat(c)}
  else{const ft=m>=45?840:480,A=wd===2?['Goblet box squat','Shoulder press','Single-arm row','Plank']:['Romanian deadlift x10','Push-ups x10','Curl to press','Dead bug'],B=wd===2?['Weighted glute bridge','Push-ups x10','Single-arm row','Plank']:['Goblet box squat','Shoulder press','Curl to press','Dead bug'];
    const f=wd===2?(alt?FM.bike[1]:FM.bike[0]):(alt?FM.bike[3]:FM.bike[2]);
    const c=cardio('bike',f,lv,main-ft),g=main-ft-sum(c);if(g>=45)c.push(S(N[3],g,'steady','Moderate pace, you can still talk'));
    const x=fin(alt?B:A,ft);segs=segs.concat(c,x);used=sum(c)+sum(x);title=f[0]+' + dumbbell circuit';cool='Stretch';gear='Bike and dumbbells'}
  const rem=T0-wu-used-cd;
  segs.push(S(cool,cd+rem,'cool',cool==='Stretch'?'Hips, hamstrings, chest, shoulders':'Slow it down, let your heart rate drop'));
  return{id:DN[wd],title:DN[wd]+' · '+title+' · '+m+' min',gear,eq,segs,note,lv}}
function regen(){const k=dk(sel);DAYS.length=0;DAYS.push(build(sel,mins,(T.shuf||{})[k]||0));day=0;setDay(0)}
buildDays=function(){const d=$('days'),k=dk(sel);d.className='dn';
  d.innerHTML='<div class="dr"><button id="dp" aria-label="Previous day">‹</button><div id="dl"></div><button id="dx" aria-label="Next day">›</button></div><div class="mr">'+[30,45].map(m=>`<button data-m="${m}" aria-pressed="${m===mins}">${m} min</button>`).join('')+`<button id="sh">Shuffle</button></div>`;
  $('dl').textContent=sel.toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'})+(k===dk(new Date())?' (today)':'');
  $('dp').onclick=()=>{sel.setDate(sel.getDate()-1);regen()};$('dx').onclick=()=>{sel.setDate(sel.getDate()+1);regen()};
  d.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{mins=+b.dataset.m;T.set.mins=mins;save();regen()});
  $('sh').onclick=()=>{T.shuf=T.shuf||{};T.shuf[k]=(T.shuf[k]||0)+1;save();regen()};
};
function mergeT(r){T.days=Object.assign({},T.days,r.days||{});const un=(a,b)=>{const m={};[...(a||[]),...(b||[])].forEach(x=>m[x[0]]=x);return Object.values(m).sort((p,q)=>p[0]<q[0]?-1:1)};T.weights=un(T.weights,r.weights);T.waist=un(T.waist,r.waist);T.set=Object.assign({},T.set,r.set||{})}
function refresh(){mins=[30,45].includes(T.set.mins)?T.set.mins:45;if(!running)regen()}
